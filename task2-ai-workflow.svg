<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1900 545" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1900" height="545" fill="#ffffff"/>

  <!-- Section containers -->
  <rect x="15" y="55" width="280" height="365" rx="14" fill="none" stroke="#212529" stroke-width="1.5" stroke-dasharray="6,5"/>
  <rect x="340" y="55" width="800" height="365" rx="14" fill="none" stroke="#2f9e44" stroke-width="1.5" stroke-dasharray="6,5"/>
  <rect x="1185" y="55" width="250" height="365" rx="14" fill="none" stroke="#e8590c" stroke-width="1.5" stroke-dasharray="6,5"/>
  <rect x="1480" y="55" width="380" height="365" rx="14" fill="none" stroke="#1971c2" stroke-width="1.5" stroke-dasharray="6,5"/>

  <!-- Section titles -->
  <text x="155" y="38" text-anchor="middle" font-size="14" font-weight="600" fill="#212529">Nguồn dữ liệu — đề xuất, chưa làm</text>
  <text x="740" y="38" text-anchor="middle" font-size="14" font-weight="600" fill="#2f9e44">RULE-BASED + AI — Python / Claude API, đã code</text>
  <text x="1310" y="38" text-anchor="middle" font-size="13" font-weight="600" fill="#e8590c">Người duyệt — đề xuất, chưa làm</text>
  <text x="1670" y="38" text-anchor="middle" font-size="13" font-weight="600" fill="#1971c2">Kết quả sau duyệt — đề xuất, chưa làm</text>

  <!-- S1: Ads API -->
  <rect x="45" y="195" width="220" height="100" rx="8" fill="#f8f9fa" stroke="#212529" stroke-width="1.5"/>
  <text x="155" y="240" text-anchor="middle" font-size="13" fill="#212529">Meta / Google / TikTok</text>
  <text x="155" y="258" text-anchor="middle" font-size="13" fill="#212529">Ads API</text>

  <!-- S2: B1 B2 B3 -->
  <rect x="350" y="195" width="220" height="100" rx="8" fill="#d3f9d8" stroke="#2f9e44" stroke-width="1.5"/>
  <text x="460" y="225" text-anchor="middle" font-size="12.5" fill="#212529">Bước 1 — Nhận data đầu vào</text>
  <text x="460" y="243" text-anchor="middle" font-size="12.5" fill="#212529">fact_daily.csv +</text>
  <text x="460" y="261" text-anchor="middle" font-size="12.5" fill="#212529">mart_campaign_summary.csv</text>

  <rect x="610" y="195" width="220" height="100" rx="8" fill="#d3f9d8" stroke="#2f9e44" stroke-width="1.5"/>
  <text x="720" y="225" text-anchor="middle" font-size="12.5" fill="#212529">Bước 2 — Tính chỉ số cảnh báo</text>
  <text x="720" y="243" text-anchor="middle" font-size="12.5" fill="#212529">CAC bất thường · lệch target ·</text>
  <text x="720" y="261" text-anchor="middle" font-size="12.5" fill="#212529">LTV:CAC giảm · CTR giảm dần</text>

  <rect x="870" y="195" width="220" height="100" rx="8" fill="#d3f9d8" stroke="#2f9e44" stroke-width="1.5"/>
  <text x="980" y="225" text-anchor="middle" font-size="12.5" fill="#212529">Bước 3 — AI đề xuất hành động</text>
  <text x="980" y="243" text-anchor="middle" font-size="12.5" fill="#212529">Scale/Maintain/Optimize/Pause,</text>
  <text x="980" y="261" text-anchor="middle" font-size="12.5" fill="#212529">% ngân sách, độ tin cậy, lý do</text>

  <!-- S3: B4 -->
  <rect x="1200" y="195" width="220" height="100" rx="8" fill="#ffe8cc" stroke="#e8590c" stroke-width="1.5"/>
  <text x="1310" y="240" text-anchor="middle" font-size="13" fill="#212529">Bước 4 — Người duyệt</text>
  <text x="1310" y="258" text-anchor="middle" font-size="13" fill="#212529">(Email / Teams / Slack)</text>

  <!-- S4: MUTATE / STOP -->
  <rect x="1495" y="100" width="350" height="90" rx="8" fill="#d0ebff" stroke="#1971c2" stroke-width="1.5"/>
  <text x="1670" y="140" text-anchor="middle" font-size="13" fill="#212529">Gọi Ads API</text>
  <text x="1670" y="158" text-anchor="middle" font-size="13" fill="#212529">tự động chỉnh ngân sách</text>

  <rect x="1495" y="300" width="350" height="90" rx="8" fill="#d0ebff" stroke="#1971c2" stroke-width="1.5"/>
  <text x="1670" y="340" text-anchor="middle" font-size="13" fill="#212529">Dừng — chờ chu kỳ</text>
  <text x="1670" y="358" text-anchor="middle" font-size="13" fill="#212529">data tiếp theo</text>

  <!-- Audit log -->
  <rect x="1185" y="460" width="675" height="55" rx="8" fill="#f1f3f5" stroke="#868e96" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="1522" y="483" text-anchor="middle" font-size="13" font-weight="600" fill="#495057">Audit log</text>
  <text x="1522" y="501" text-anchor="middle" font-size="12" fill="#495057">(ghi ai duyệt / từ chối, lúc nào)</text>

  <!-- Arrows -->
  <line x1="265" y1="245" x2="345" y2="245" stroke="#333333" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="307" y="220" text-anchor="middle" font-size="10.5" fill="#495057">Bước 5 (đề xuất):</text>
  <text x="307" y="233" text-anchor="middle" font-size="10.5" fill="#495057">tự động lấy data</text>

  <line x1="570" y1="245" x2="605" y2="245" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="830" y1="245" x2="865" y2="245" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>

  <line x1="1090" y1="245" x2="1195" y2="245" stroke="#333333" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="1160" y="230" text-anchor="middle" font-size="10.5" fill="#495057">media plan JSON</text>

  <polyline points="1420,225 1460,225 1460,145 1490,145" fill="none" stroke="#2f9e44" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="1460" y="182" text-anchor="middle" font-size="11" font-weight="600" fill="#2f9e44">YES, duyệt</text>

  <polyline points="1420,265 1460,265 1460,345 1490,345" fill="none" stroke="#e03131" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="1460" y="308" text-anchor="middle" font-size="11" font-weight="600" fill="#e03131">NO, từ chối</text>

  <line x1="1310" y1="295" x2="1310" y2="455" stroke="#868e96" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="1345" y="380" text-anchor="middle" font-size="10.5" fill="#495057">luôn ghi lại</text>
  <text x="1345" y="393" text-anchor="middle" font-size="10.5" fill="#495057">quyết định</text>

  <polyline points="1600,190 1600,450 155,450 155,300" fill="none" stroke="#1971c2" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="875" y="438" text-anchor="middle" font-size="11" fill="#1971c2">nếu duyệt → tự động chỉnh ngân sách / campaign trên Ads API</text>
</svg>
